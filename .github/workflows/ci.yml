name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
            os: ubuntu-latest
          - elixir: "1.20"
            otp: "29"
            os: ubuntu-latest
          - elixir: "1.20"
            otp: "29"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix compile --warnings-as-errors
        if: runner.os == 'Linux'
      - run: mix format --check-formatted
        if: runner.os == 'Linux'
      - run: mix test
